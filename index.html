    /* ── Stage actions ── */

    function stageOf(pid, key) { return getP(pid).stages[key]; }

    function setStageStatus(pid, key, val) {
      const p = getP(pid);
      p.stages[key].status = val;
      if (val === 'Complete' && p.status !== 'Complete' && STAGES.every(s => p.stages[s.key].status === 'Complete')
          && confirm('All three stages are complete. Mark the whole project as complete?')) {
        p.status = 'Complete';
      }
      save(); render();
    }

    function setStageField(pid, key, field, val, rerender) {
      const p = getP(pid);
      const st = p.stages[key];
      const oldEnd = st.end || st.start;
      st[field] = val;
      if (field === 'start' && st.end && st.end < val) st.end = val;

      /* Offer to slide the later stages by the same number of working days */
      const newEnd = st.end || st.start;
      if ((field === 'start' || field === 'end') && oldEnd && newEnd) {
        const delta = workDaysBetween(oldEnd, newEnd);
        const later = STAGES.slice(STAGES.findIndex(s => s.key === key) + 1)
          .map(s => p.stages[s.key]).filter(x => x.start && x.status !== 'Complete');
        if (delta && later.length && confirm(`Move the later stages ${Math.abs(delta)} working day${Math.abs(delta) === 1 ? '' : 's'} ${delta > 0 ? 'later' : 'earlier'} too?`)) {
          later.forEach(x => {
            x.start = shiftWorkDays(x.start, delta);
            if (x.end) x.end = shiftWorkDays(x.end, delta);
          });
        }
      }
      save();
      if (rerender) render();
    }

    function toggleCrew(pid, key, cid) {
      const st = stageOf(pid, key);
      st.crew = st.crew.includes(cid) ? st.crew.filter(c => c !== cid) : [...st.crew, cid];
      save(); render();
    }

    function toggleCheck(pid, key, id) {
      const item = stageOf(pid, key).checklist.find(i => i.id === id);
      item.done = !item.done;
      item.doneAt = item.done ? Date.now() : null;
      const st = stageOf(pid, key);
      if (item.done && st.status === 'Not started') st.status = 'In progress';
      save(); render();
    }

    function addCheck(pid, key, input) {
      const text = input.value.trim();
      if (!text) return;
      stageOf(pid, key).checklist.push({ id: uid(), text, done: false });
      save(); render();
    }

    function delItem(pid, key, list, id) {
      const st = stageOf(pid, key);
      if (!confirm('Remove this entry?')) return;
      st[list] = st[list].filter(x => x.id !== id);
      save(); render();
    }

    function addReading(pid, key, f) {
      stageOf(pid, key).readings.push({
        id: uid(), type: f.rtype.value, value: f.value.value.trim(), unit: f.unit.value.trim(),
        by: f.by.value, note: f.note.value.trim(), at: Date.now()
      });
      save(); render(); toast('Reading saved');
    }

    function addTime(pid, key, f) {
      stageOf(pid, key).time.push({ id: uid(), crewId: f.crewId.value, date: f.date.value, hours: f.hours.value, note: f.note.value.trim() });
      save(); render(); toast('Time logged');
    }

    async function addPhotos(pid, key, files) {
      const st = stageOf(pid, key);
      toast('Saving photos…');
      for (const file of files) {
        try {
          const data = await compressImage(file);
          const id = uid();
          await idb('photos', 'readwrite', s => s.put(data, id));
          photoCache.set(id, data);
          queueUpload('photos', id);
          st.photos.push({ id, caption: '', at: Date.now() });
        } catch (err) {
          console.error(err);
          toast('A photo could not be saved');
        }
      }
      save(); render(); toast(files.length === 1 ? 'Photo added' : files.length + ' photos added');
    }

    function openPhoto(pid, key, phid) {
      const ph = stageOf(pid, key).photos.find(x => x.id === phid);
      showModal(`
        <div class="lightbox"><img data-photo="${ph.id}" alt="" /></div>
        <label class="lbl" style="margin-top:14px">Caption</label>
        <input id="ph-caption" value="${esc(ph.caption)}" placeholder="e.g. Pipe run in roof space" />
        <div class="faint" style="margin-top:8px">Added ${fmtTime(ph.at)}</div>
        <div class="modal-actions">
          <button class="btn" onclick="savePhotoCaption('${pid}','${key}','${ph.id}')">Save</button>
          <button class="btn btn-ghost" onclick="closeModal()">Close</button>
          <span class="spacer"></span>
          <button class="btn btn-danger" onclick="deletePhoto('${pid}','${key}','${ph.id}')">Delete</button>
        </div>`);
      loadPhotos();
    }

    function savePhotoCaption(pid, key, phid) {
      stageOf(pid, key).photos.find(x => x.id === phid).caption = $('ph-caption').value.trim();
      save(); closeModal(); render();
    }

    async function deletePhoto(pid, key, phid) {
      if (!confirm('Delete this photo?')) return;
      const st = stageOf(pid, key);
      st.photos = st.photos.filter(x => x.id !== phid);
      await idb('photos', 'readwrite', s => s.delete(phid));
      photoCache.delete(phid);
      removeRemoteFile('photos', phid);
      save(); closeModal(); render();
    }

    /* ── Signature pad ── */

    function initSig(c) {
      const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      c.width = r.width * dpr;
      c.height = r.height * dpr;
      const ctx = c.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
      c.dataset.ink = '';
      let drawing = false;
      const pos = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
      c.onpointerdown = e => {
        drawing = true;
        c.setPointerCapture(e.pointerId);
        const [x, y] = pos(e);
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 0.1, y + 0.1); ctx.stroke();
        c.dataset.ink = '1';
      };
      c.onpointermove = e => { if (!drawing) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); };
      c.onpointerup = c.onpointercancel = () => { drawing = false; };
    }

    function saveSignoff(pid, key) {
      const name = $('sig-name').value.trim();
      const c = $('sigpad');
      if (!name) { toast('Enter the signer’s name'); return; }
      if (!c.dataset.ink) { toast('Please sign in the box'); return; }
      const st = stageOf(pid, key);
      const pr = checkProgress(st);
      if (pr.done < pr.total && !confirm(`Only ${pr.done} of ${pr.total} checklist items are ticked. Sign off anyway?`)) return;
      st.signoff = { name, date: today(), sig: c.toDataURL('image/png') };
      if (st.status !== 'Complete' && confirm('Signed off. Mark this stage as complete too?')) {
        setStageStatus(pid, key, 'Complete');
        return;
      }
      save(); render();
    }

    function clearSignoff(pid, key) {
      if (!confirm('Remove this sign-off?')) return;
      stageOf(pid, key).signoff = null;
      save(); render();
    }

    /* ══════════ Schedule ══════════ */

    function scheduleHead() {
      return `<div class="page-head"><h1 class="page-title">Schedule</h1>
        <div class="seg">${[['month', 'Month'], ['timeline', 'Timeline']].map(([v, l]) =>
          `<button class="${ui.schedView === v ? 'on' : ''}" onclick="ui.schedView='${v}'; render()">${l}</button>`).join('')}</div>
      </div>`;
    }

    /* Milestones and deadlines falling on a given day (hidden when filtering by crew) */
    function marksOn(d) {
      if (ui.calCrew) return [];
      return state.projects.filter(p => p.status !== 'Complete').flatMap(p => [
        ...p.milestones.filter(m => m.date === d).map(m => ({ p, title: m.title, color: msColor(m) })),
        ...(p.deadline === d ? [{ p, title: 'Deadline / handover', color: 'var(--c-red)' }] : [])
      ]);
    }

    function scheduleView() {
      if (ui.schedView === 'timeline') return scheduleHead() + timelineView();
      const [y, m] = ui.calMonth.split('-').map(Number);
      const first = new Date(y, m - 1, 1);
      const startOffset = (first.getDay() + 6) % 7; /* Monday first */
      const gridStart = isoOf(new Date(y, m - 1, 1 - startOffset));
      const daysInMonth = new Date(y, m, 0).getDate();
      const cells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
      const t = today();
      const all = bookings().filter(b => b.p.status !== 'Complete' && (!ui.calCrew || b.crew.includes(ui.calCrew)));
      const on = d => all.filter(b => b.start <= d && b.end >= d);
      const monthName = first.toLocaleDateString('en-AU', { month: 'long', year: 'numeric' });

      let grid = '';
      for (let i = 0; i < cells; i++) {
        const d = addDays(gridStart, i);
        const bs = on(d);
        const hol = holidayOn(d);
        const cls = ['cal-day', d.slice(0, 7) !== ui.calMonth && 'other', d === t && 'today', d === ui.selDay && 'sel', hol && 'hol'].filter(Boolean).join(' ');
        grid += `<button class="${cls}" onclick="ui.selDay='${d}'; render()" ${hol ? `title="${esc(hol)}"` : ''}>
          <span class="dnum">${Number(d.slice(8))}</span>
          ${hol ? `<span class="cal-hol">${esc(hol)}</span>` : ''}
          ${bs.slice(0, 3).map(b => `<span class="cal-chip" style="background:${b.s.color}${b.st.status === 'Complete' ? ';opacity:.4' : ''}">${esc(b.p.name)}</span>`).join('')}
          ${bs.length > 3 ? `<span class="cal-more">+${bs.length - 3}</span>` : ''}
          ${marksOn(d).slice(0, 2).map(mk => `<span class="cal-chip cal-mark" style="color:${mk.color}">◆ ${esc(mk.p.name)}</span>`).join('')}
        </button>`;
      }

      const dayList = on(ui.selDay);
      const unscheduled = [];
      state.projects.filter(p => p.status === 'Active').forEach(p => STAGES.forEach(s => {
        const st = p.stages[s.key];
        if (!st.start && st.status !== 'Complete') unscheduled.push({ p, s, st, crew: st.crew });
      }));

      return `
        ${scheduleHead()}
        <section class="card">
          <div class="cal-head">
            <button class="icon-btn" onclick="shiftMonth(-1)" title="Previous month">${ICON.left}</button>
            <span class="month">${monthName}</span>
            <button class="icon-btn" onclick="shiftMonth(1)" title="Next month">${ICON.right}</button>
            <button class="btn btn-ghost btn-sm" onclick="ui.calMonth='${t.slice(0, 7)}'; ui.selDay='${t}'; render()">Today</button>
            <select onchange="ui.calCrew=this.value; render()">
              <option value="">All crew</option>
              ${state.crew.map(c => `<option value="${c.id}" ${ui.calCrew === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
            </select>
          </div>
          <div class="cal">
            ${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="cal-dow">${d}</div>`).join('')}
            ${grid}
          </div>
          <div class="legend">${STAGES.map(s => `<span><span class="dot" style="background:${s.color}"></span>${s.label}</span>`).join('')}<span><span class="ms-key"></span>Milestone / deadline</span></div>
        </section>
        <div class="grid2" style="margin-top:12px">
          <section class="card">
            <h2>${fmtDate(ui.selDay, true)} ${holidayOn(ui.selDay) ? `<span class="tag tag-warn">${esc(holidayOn(ui.selDay))}</span>` : ''}</h2>
            <div class="rows">${dayList.length || marksOn(ui.selDay).length
              ? marksOn(ui.selDay).map(mk => `<a class="brow" href="#/project/${mk.p.id}">
                  <span class="ms-key" style="background:${mk.color};margin-top:6px"></span>
                  <div class="brow-main"><div class="brow-title">${esc(mk.p.name)} · ${esc(mk.title)}</div><div class="muted">Milestone</div></div>
                </a>`).join('') + dayList.map(bookingRow).join('')
              : empty('Nothing booked on this day.')}</div>
          </section>
          <section class="card">
            <h2>Not yet scheduled <span class="muted">${unscheduled.length}</span></h2>
            <div class="rows">${unscheduled.length ? unscheduled.map(u => `<a class="brow" href="#/project/${u.p.id}/stage/${u.s.key}">
              <span class="dot" style="background:${u.s.color}"></span>
              <div class="brow-main"><div class="brow-title">${esc(u.p.name)} · ${u.s.label}</div><div class="muted">${esc(u.p.jobNo)} · tap to set dates and crew</div></div>
            </a>`).join('') : empty('Every open stage has dates.')}</div>
          </section>
        </div>`;
    }

    function shiftMonth(n) {
      const [y, m] = ui.calMonth.split('-').map(Number);
      const d = new Date(y, m - 1 + n, 1);
      ui.calMonth = isoOf(d).slice(0, 7);
      ui.selDay = ui.calMonth === today().slice(0, 7) ? today() : isoOf(d);
      render();
    }

    /* ══════════ Crew ══════════ */

    function crewView() {
      const t = today();
      const bs = bookings().filter(b => b.st.status !== 'Complete' && b.p.status !== 'Complete' && b.end >= t);
      const hours = {};
      state.projects.forEach(p => STAGES.forEach(s => p.stages[s.key].time.forEach(x => {
        hours[x.crewId] = (hours[x.crewId] || 0) + (parseFloat(x.hours) || 0);

      const sorted = [...state.crew].sort((a, b) => (a.active === false) - (b.active === false) || a.name.localeCompare(b.name));

            ${c.licences ? `<div class="faint" style="margin-top:6px">${esc(c.licences)}</div>` : ''}
            <div class="faint" style="margin-top:6px">${fmtH(hours[c.id] || 0)} logged · ${c.costRate ? money(c.costRate) + '/h' : 'default rate'}</div>
            <div class="rows" style="margin-top:10px">${mine.length ? mine.slice(0, 4).map(bookingRow).join('') : empty('No upcoming bookings')}</div>
          </div>`;
        }).join('')}</div>` : `<section class="card">${empty('No crew yet. Add technicians, plumbers and apprentices so you can assign them to project stages.')}</section>`}`;

    function editCrew(id) {
      const c = id ? getCrew(id) : { name: '', role: 'Technician', phone: '', licences: '', active: true };
      openForm({
        title: id ? 'Edit crew member' : 'Add crew member',

      });

        </section>` : `<section class="card">
          <h2>Data on this device</h2>
          <p class="muted" style="margin-bottom:12px">All projects, crew and photos are stored only in this browser on this device. Other phones and computers won’t see them, and clearing browser data will erase them.</p>

    }

    function addClosure(f) {
      const from = f.from.value, to = f.to.value && f.to.value >= from ? f.to.value : from;
      state.settings.closures.push({ id: uid(), name: f.cname.value.trim(), from, to });
      save(); render(); toast('Shutdown added');
    }

    function delClosure(id) {
      state.settings.closures = state.settings.closures.filter(c => c.id !== id);
      save(); render();
    }

    function upcomingHolidays() {
      const t = today(), end = addDays(t, 365);
      /* [from, to, name] — consecutive days with the same name (a shutdown) become one row */
      const out = [];
      for (let d = t; d <= end; d = addDays(d, 1)) {
        const n = holidayOn(d);
        if (!n) continue;
        const last = out[out.length - 1];
        if (last && last[2] === n && last[1] === addDays(d, -1)) last[1] = d;
        else out.push([d, d, n]);
      }
      return out.filter(([from, to]) => holidaysBetween(from, to).length);
    }

    async function showStorageUsed() {
      const el = $('storage-used');
      if (!el) return;
      if (!navigator.storage?.estimate) { el.textContent = 'Unknown'; return; }
      const { usage } = await navigator.storage.estimate();
      el.textContent = usage > 1048576 ? (usage / 1048576).toFixed(1) + ' MB' : Math.round(usage / 1024) + ' KB';
    }

    /* Share sheet on phones (save to Files, email…), plain download elsewhere. False if cancelled. */
    async function saveFile(file) {
      if (matchMedia('(pointer: coarse)').matches && navigator.canShare?.({ files: [file] })) {
        try { await navigator.share({ files: [file], title: file.name }); } catch (err) { if (err.name === 'AbortError') return false; }
        return true;
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(file);
      a.download = file.name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      return true;
    }

    async function exportBackup() {
      toast('Preparing backup…');
      const photos = Object.fromEntries(await idbAll('photos'));
      const files = {};
      for (const [k, blob] of await idbAll('files')) files[k] = await blobToDataURL(blob);
      const json = JSON.stringify({ app: 'hcm-projects', version: 1, exported: new Date().toISOString(), state: { ...state, lastBackup: today() }, photos, files });
      const file = new File([json], `hcm-projects-backup-${today()}.json`, { type: 'application/json' });
      if (!(await saveFile(file))) return;
      state.lastBackup = today();
      save(); render();
    }

    async function importBackup(file) {
      if (!file) return;
      let data;
      try {
        data = JSON.parse(await file.text());
        if (data.app !== 'hcm-projects' || !Array.isArray(data.state?.projects)) throw new Error('bad file');
      } catch {
        toast('That file is not an HCM Projects backup');
        return;
      }
      if (!confirm(`Replace all data on this device with the backup from ${new Date(data.exported).toLocaleString('en-AU')} (${data.state.projects.length} projects)?`)) return;
      await idb('photos', 'readwrite', s => {
        s.clear();
        Object.entries(data.photos || {}).forEach(([k, v]) => s.put(v, k));
      });
      const files = await Promise.all(Object.entries(data.files || {}).map(async ([k, v]) => [k, await (await fetch(v)).blob()]));
      await idb('files', 'readwrite', s => {
        s.clear();
        files.forEach(([k, b]) => s.put(b, k));
      });
      photoCache.clear();
      state = normalize(data.state);
      await idb('kv', 'readwrite', s => s.put(state, 'state'));
      toast('Backup imported');
      location.hash = '#/';
      render();
    }

    async function eraseAll() {
      if (prompt('This deletes everything on this device. Type ERASE to confirm.') !== 'ERASE') return;
      await idb('photos', 'readwrite', s => s.clear());
      await idb('files', 'readwrite', s => s.clear());
      photoCache.clear();
      state = normalize({ version: 1, projects: [], crew: [], lastBackup: '', settings: state.settings });
      await idb('kv', 'readwrite', s => s.put(state, 'state'));
      toast('All data erased');
      location.hash = '#/';
      render();
    }

    /* ══════════ Timeline planning ══════════ */

    const STAGE_SPLIT = { planning: 0.1, roughin: 0.45, fitoff: 0.45 };
    const DEFAULT_STAGE_HOURS = { planning: 4, roughin: 24, fitoff: 16 };
    const msColor = m => m.done ? 'var(--c-green)' : m.date && m.date < today() ? 'var(--c-red)' : 'var(--white)';

    /* Stage estimate: its own, else a share of the project's quoted hours, else a typical default */
    function defaultStageHours(p, key) {
      const own = parseFloat(p.stages[key].estHours);
      if (own) return own;
      if (parseFloat(p.quotedHours)) return Math.round(parseFloat(p.quotedHours) * STAGE_SPLIT[key] * 4) / 4;
      return DEFAULT_STAGE_HOURS[key];
    }

    const stageDays = (hours, people) => Math.max(1, Math.ceil(hours / (Math.max(1, people) * (parseFloat(state.settings.hoursPerDay) || 8))));

    /* rows: [{ key, days, gap }] in stage order. mode 'start' works forward from anchor, 'finish' works back from it. */
    function planDates(rows, mode, anchor) {
      const out = {};
      if (mode === 'start') {
        let cur = nextWorkDay(anchor);
        rows.forEach(r => {
          const end = shiftWorkDays(cur, r.days - 1);
          out[r.key] = { start: cur, end };
          cur = shiftWorkDays(end, r.gap + 1);
        });
      } else {
        let nextStart = null;
        [...rows].reverse().forEach(r => {
          const end = nextStart ? shiftWorkDays(nextStart, -(r.gap + 1)) : prevWorkDay(anchor);
          const start = shiftWorkDays(end, -(r.days - 1));
          out[r.key] = { start, end };
          nextStart = start;
        });
      }
      return out;
    }

    function timelineStatus(p) {
      const ends = STAGES.map(s => p.stages[s.key]).filter(st => st.start).map(st => st.end || st.start).sort();
      const finish = ends[ends.length - 1] || '';
      const allScheduled = STAGES.every(s => p.stages[s.key].start || p.stages[s.key].status === 'Complete');
      return { finish, allScheduled, spare: finish && p.deadline ? workDaysBetween(finish, p.deadline) : null };
    }

    /* Gantt chart. rows: [{ label, sub (HTML), href, bars: [{ start, end, color, faded, title }], marks: [{ date, color, title, deadline }] }] */
    function gantt(rows, from, to, opts = {}) {
      const total = dayDiff(from, to) + 1;
      const pos = iso => dayDiff(from, iso) / total * 100;
      const inRange = iso => iso >= from && iso <= to;
      let ticks = [];
      for (let d = mondayOf(from) < from ? addDays(mondayOf(from), 7) : mondayOf(from); d <= to; d = addDays(d, 7)) ticks.push(d);
      if (ticks.length > 14) ticks = ticks.filter((_, i) => i % Math.ceil(ticks.length / 14) === 0);
      const t = today();
      const dlLine = iso => `<i class="g-dl" title="Deadline ${fmtDate(iso)}" style="left:${(dayDiff(from, iso) + 1) / total * 100}%"></i>`;
      const lines = ticks.map(d => `<i class="g-line" style="left:${pos(d)}%"></i>`).join('')
        + (inRange(t) ? `<i class="g-today" style="left:${pos(t)}%"></i>` : '')
        + (opts.deadline && inRange(opts.deadline) ? dlLine(opts.deadline) : '');

      return `<div class="gantt"><div style="min-width:${Math.max(560, total * 9)}px">
        <div class="g-row g-head"><div class="g-label"></div><div class="g-track">${ticks.map(d => `<span class="g-tick" style="left:${pos(d)}%">${fmtDate(d)}</span>`).join('')}</div></div>
        ${rows.map(r => `<div class="g-row">
          <div class="g-label">${r.href ? `<a href="${r.href}">${esc(r.label)}</a>` : esc(r.label)}${r.sub ? `<div class="faint">${r.sub}</div>` : ''}</div>
          <div class="g-track">${lines}
            ${r.bars.map(b => {
              const a = b.start < from ? from : b.start, e = b.end > to ? to : b.end;
              if (e < from || a > to) return '';
              return `<span class="g-bar" title="${esc(b.title || '')}" style="left:${pos(a)}%;width:${(dayDiff(a, e) + 1) / total * 100}%;background:${b.color}${b.faded ? ';opacity:.4' : ''}"></span>`;
            }).join('')}
            ${r.marks.filter(m => inRange(m.date)).map(m => m.deadline ? dlLine(m.date)
              : `<span class="g-mark" title="${esc(m.title)} — ${fmtDate(m.date)}" style="left:${(dayDiff(from, m.date) + 0.5) / total * 100}%;background:${m.color}"></span>`).join('')}
          </div>
        </div>`).join('')}
      </div></div>`;
    }

    function stageBar(p, s) {
      const st = p.stages[s.key];
      const end = st.end || st.start;
      return { start: st.start, end, color: s.color, faded: st.status === 'Complete', title: `${s.label}: ${dateRange(st.start, end)}` };
    }

    function timelineSection(p) {
      const t = today();
      const rows = STAGES.filter(s => p.stages[s.key].start).map(s => ({
        label: s.label, sub: dateRange(p.stages[s.key].start, p.stages[s.key].end), href: `#/project/${p.id}/stage/${s.key}`,
        bars: [stageBar(p, s)], marks: []
      }));
      const ms = p.milestones.filter(m => m.date);
      if (ms.length) rows.push({ label: 'Milestones', sub: `${ms.filter(m => m.done).length} of ${ms.length} done`, bars: [], marks: ms.map(m => ({ date: m.date, color: msColor(m), title: m.title })) });

      const ts = timelineStatus(p);
      let status;
      if (!p.deadline) status = '<span class="tag">No deadline set</span>';
      else if (ts.spare === null) status = `<span class="tag">Deadline ${fmtDate(p.deadline, true)}</span>`;
      else if (ts.spare >= 0) status = `<span class="tag tag-good">On track · finishes ${fmtDate(ts.finish)}, ${ts.spare} working day${ts.spare === 1 ? '' : 's'} before the ${fmtDate(p.deadline)} deadline</span>`;
      else status = `<span class="tag tag-bad">Finishes ${fmtDate(ts.finish)} · ${-ts.spare} working day${ts.spare === -1 ? '' : 's'} past the ${fmtDate(p.deadline)} deadline</span>`;
      if (p.deadline && !ts.allScheduled) status += ' <span class="tag tag-warn">Some stages not scheduled</span>';

      const dates = [...rows.flatMap(r => [...r.bars.flatMap(b => [b.start, b.end]), ...r.marks.map(m => m.date)]), p.deadline].filter(Boolean).sort();
      const chart = rows.length
        ? gantt(rows, addDays(dates[0], -3), addDays(dates[dates.length - 1], 3), { deadline: p.deadline })
        : empty('No dates yet. Use Plan timeline to build the schedule from the scope of work.');

      const list = [...p.milestones].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
      return `
        <div class="chips" style="margin-bottom:14px">${status}</div>
        ${chart}
        ${list.length ? `<div class="rows" style="margin-top:12px">${list.map(m => `<div class="check ${m.done ? 'done' : ''}">
          <input type="checkbox" ${m.done ? 'checked' : ''} onchange="toggleMilestone('${p.id}','${m.id}')" />
          <div class="check-text">${esc(m.title)}<div class="faint">${m.date ? fmtDate(m.date, true) : 'No date'}${!m.done && m.date && m.date < t ? ' · overdue' : ''}</div></div>
          <button class="icon-btn" title="Edit" onclick="editMilestone('${p.id}','${m.id}')">${ICON.edit}</button>
        </div>`).join('')}</div>` : ''}`;
    }

    function editMilestone(pid, mid) {
      const p = getP(pid);
      const m = mid ? p.milestones.find(x => x.id === mid) : { title: '', date: '', done: false };
      openForm({
        title: mid ? 'Edit milestone' : 'Add milestone',
        fields: [
          { name: 'title', label: 'Milestone', value: m.title, required: true, wide: true, placeholder: 'e.g. Plumbing rough-in inspection, Gas compliance cert' },
          { name: 'date', label: 'Date', value: m.date, type: 'date', required: true },
          { name: 'done', label: 'Status', value: m.done ? 'Done' : 'Not done', options: ['Not done', 'Done'] }
        ],
        onSave: v => {
          const data = { title: v.title.trim(), date: v.date, done: v.done === 'Done' };
          if (mid) Object.assign(m, data); else p.milestones.push({ id: uid(), ...data });
        },
        onDelete: mid && (() => { p.milestones = p.milestones.filter(x => x.id !== mid); })
      });

    function toggleMilestone(pid, mid) {
      const m = getP(pid).milestones.find(x => x.id === mid);
      m.done = !m.done;
      save(); render();
    }

    function upsertMilestone(p, auto, title, date) {
      const m = p.milestones.find(x => x.auto === auto);
      if (m) { if (!m.done) m.date = date; }
      else p.milestones.push({ id: uid(), auto, title, date, done: false });
    }

    /* ── Plan timeline modal: scope of work → stage dates ── */

    function planTimeline(pid) {
      const p = getP(pid);
      const open = STAGES.filter(s => p.stages[s.key].status !== 'Complete');
      if (!open.length) { toast('All stages are already complete'); return; }
      const start = p.stages[open[0].key].start || nextWorkDay(addDays(today(), 1));
      showModal(`
        <h3>Plan timeline</h3>
        <p class="muted">Builds stage dates from the scope of work: estimated hours per stage, how many people are on it, and the lead time before the next stage (ordering, plastering, other trades). Non-working days are skipped; completed stages are left alone.</p>
        <form id="tl-form" oninput="tlInput(event, '${pid}')" onsubmit="event.preventDefault(); tlApply('${pid}')">
          <div class="fgrid" style="margin-top:16px">
            <div class="fwide"><label class="lbl">Schedule</label>
              <select name="mode">
                <option value="start" ${p.deadline ? '' : 'selected'}>Forward from a start date</option>
                <option value="finish" ${p.deadline ? 'selected' : ''}>Back from the deadline</option>
              </select></div>
            <div><label class="lbl">Start date</label><input type="date" name="start" value="${start}" /></div>
            <div><label class="lbl">Deadline / handover</label><input type="date" name="deadline" value="${p.deadline}" /></div>
          </div>
          ${open.map((s, i) => {
            const st = p.stages[s.key];
            const hours = defaultStageHours(p, s.key);
            const people = st.people || Math.max(1, st.crew.length);
            const last = i === open.length - 1;
            const gap = st.gapAfter ?? state.settings.gaps[s.key] ?? 0;
            return `<div class="tl-stage">
              <div class="tl-name"><span class="dot" style="background:${s.color}"></span>${s.label}${st.status === 'In progress' ? ' <span class="tag tag-warn">In progress</span>' : ''}</div>
              <div class="tl-grid">
                <div><label class="lbl">Est. hours</label><input type="number" name="h_${s.key}" value="${hours}" step="0.25" min="0" /></div>
                <div><label class="lbl">People</label><input type="number" name="n_${s.key}" value="${people}" min="1" step="1" /></div>
                <div><label class="lbl">Work days</label><input type="number" name="d_${s.key}" value="${stageDays(hours, people)}" min="1" step="1" /></div>
                <div><label class="lbl">Lead after</label><input type="number" name="g_${s.key}" value="${last ? 0 : gap}" min="0" step="1" ${last ? 'disabled' : ''} /></div>
              </div>
            </div>`;
          }).join('')}
          <label class="toggle" style="margin-top:16px"><input type="checkbox" name="ms" checked /> Add key milestones (equipment ordered, rough-in inspection, handover)</label>
          <div id="tl-preview" style="margin-top:6px"></div>
          <div class="modal-actions">
            <button class="btn" type="submit">Apply to schedule</button>
            <button class="btn btn-ghost" type="button" onclick="closeModal()">Cancel</button>
          </div>
        </form>`);
      tlPreview(pid);
    }

    function tlInput(e, pid) {
      const f = $('tl-form');
      const name = e.target.name || '';
      if (/^[hn]_/.test(name)) {
        const key = name.slice(2);
        f['d_' + key].value = stageDays(parseFloat(f['h_' + key].value) || 0, parseInt(f['n_' + key].value, 10) || 1);
      }
      tlPreview(pid);
    }

    function tlRead(pid) {
      const p = getP(pid), f = $('tl-form');
      const rows = STAGES.filter(s => p.stages[s.key].status !== 'Complete').map(s => ({
        key: s.key,
        hours: parseFloat(f['h_' + s.key].value) || 0,
        people: parseInt(f['n_' + s.key].value, 10) || 1,
        days: Math.max(1, parseInt(f['d_' + s.key].value, 10) || 1),
        gap: Math.max(0, parseInt(f['g_' + s.key].value, 10) || 0)
      }));
      rows[rows.length - 1].gap = 0;
      const mode = f.mode.value, start = f.start.value, deadline = f.deadline.value;
      const anchor = mode === 'start' ? start : deadline;
      return { p, rows, mode, deadline, milestones: f.ms.checked, plan: anchor ? planDates(rows, mode, anchor) : null };
    }

    function tlPreview(pid) {
      const t = tlRead(pid);
      const el = $('tl-preview');
      if (!t.plan) {
        el.innerHTML = `<div class="warn-box">${t.mode === 'start' ? 'Pick a start date.' : 'Enter a deadline to work back from.'}</div>`;
        return;
      }
      const p = t.p;
      const keys = t.rows.map(r => r.key);
      const first = t.plan[keys[0]].start, finish = t.plan[keys[keys.length - 1]].end;
      const msgs = [];
      if (t.deadline) {
        const spare = workDaysBetween(finish, t.deadline);
        msgs.push(spare >= 0
          ? `<div class="ok-box">Finishes ${fmtDate(finish, true)} — ${spare} working day${spare === 1 ? '' : 's'} before the deadline.</div>`
          : `<div class="warn-box">Finishes ${fmtDate(finish, true)} — ${-spare} working day${spare === -1 ? '' : 's'} after the ${fmtDate(t.deadline, true)} deadline. Add people or shorten lead times.</div>`);
      } else {
        msgs.push(`<div class="ok-box">Finishes ${fmtDate(finish, true)}.</div>`);
      }
      if (first < today() && p.stages[keys[0]].status !== 'In progress') {
        msgs.push(`<div class="warn-box">${STAGES.find(s => s.key === keys[0]).label} would need to start ${fmtDate(first, true)}, which has already passed.</div>`);
      }
      const others = bookings().filter(b => b.p !== p && b.st.status !== 'Complete' && b.p.status !== 'Complete');
      const clashText = [];
      keys.forEach(k => {
        const r = t.plan[k];
        others.forEach(b => {
          if (r.start <= b.end && b.start <= r.end) {
            p.stages[k].crew.filter(c => b.crew.includes(c)).forEach(c => clashText.push(`${esc(getCrew(c)?.name)} is on ${esc(b.p.name)} (${b.s.label}), ${dateRange(b.start, b.end)}`));
          }
        });
      });
      if (clashText.length) msgs.push(`<div class="warn-box"><b>Crew clashes</b><br>${clashText.join('<br>')}</div>`);

      const rows = t.rows.map(r => {
        const s = STAGES.find(x => x.key === r.key);
        const d = t.plan[r.key];
        return { label: s.label, sub: `${dateRange(d.start, d.end)} · ${r.days} day${r.days === 1 ? '' : 's'}`, bars: [{ start: d.start, end: d.end, color: s.color }], marks: [] };
      });
      const last = [finish, t.deadline].filter(Boolean).sort().pop();
      el.innerHTML = msgs.join('') + `<div style="margin-top:14px">${gantt(rows, addDays(first, -2), addDays(last, 2), { deadline: t.deadline })}</div>`;
    }

    function tlApply(pid) {
      const t = tlRead(pid);
      if (!t.plan) { tlPreview(pid); return; }
      const p = t.p;
      t.rows.forEach(r => {
        Object.assign(p.stages[r.key], t.plan[r.key], { estHours: String(r.hours), people: r.people, gapAfter: r.gap });
      });
      if (t.deadline) p.deadline = t.deadline;
      if (t.milestones) {
        if (t.plan.planning) upsertMilestone(p, 'order', 'Equipment ordered', t.plan.planning.end);
        if (t.plan.roughin) upsertMilestone(p, 'inspect', 'Rough-in inspection', shiftWorkDays(t.plan.roughin.end, 1));
        if (t.plan.fitoff) upsertMilestone(p, 'handover', 'Handover / practical completion', t.plan.fitoff.end);
      }
      save(); closeModal(); render();
      toast('Timeline added to the schedule');
    }

    /* ── Schedule tab: all-projects timeline ── */

    function timelineView() {
      const from = ui.tlFrom, to = addDays(from, 7 * 12 - 1);
      const overlaps = r => r.bars.some(b => b.end >= from && b.start <= to) || r.marks.some(m => m.date >= from && m.date <= to);
      const rows = state.projects.filter(p => p.status !== 'Complete').map(p => {
        const stages = STAGES.filter(s => p.stages[s.key].start && (!ui.calCrew || p.stages[s.key].crew.includes(ui.calCrew)));
        const marks = ui.calCrew ? [] : [
          ...p.milestones.filter(m => m.date).map(m => ({ date: m.date, color: msColor(m), title: m.title })),
          ...(p.deadline ? [{ date: p.deadline, title: 'Deadline', deadline: true }] : [])
        ];
        const ts = timelineStatus(p);
        const late = ts.spare !== null && ts.spare < 0;
        return {
          label: p.name, href: `#/project/${p.id}`,
          sub: `${esc(p.jobNo)}${p.deadline ? ` · <span class="${late ? 'over' : ''}">due ${fmtDate(p.deadline)}</span>` : ''}`,
          bars: stages.map(s => stageBar(p, s)), marks,
          first: stages.length ? p.stages[stages[0].key].start : p.deadline || '9999'
        };
      }).filter(overlaps).sort((a, b) => a.first.localeCompare(b.first));

      const toPlan = state.projects.filter(p => p.status === 'Active' && STAGES.some(s => !p.stages[s.key].start && p.stages[s.key].status !== 'Complete'));

      return `
        <section class="card">
          <div class="cal-head">
            <button class="icon-btn" onclick="ui.tlFrom = addDays(ui.tlFrom, -28); render()" title="Earlier">${ICON.left}</button>
            <span class="month" style="min-width:0">${fmtDate(from)} – ${fmtDate(to, true)}</span>
            <button class="icon-btn" onclick="ui.tlFrom = addDays(ui.tlFrom, 28); render()" title="Later">${ICON.right}</button>
            <button class="btn btn-ghost btn-sm" onclick="ui.tlFrom = mondayOf(today()); render()">Today</button>
            <select onchange="ui.calCrew = this.value; render()">
              <option value="">All crew</option>
              ${state.crew.map(c => `<option value="${c.id}" ${ui.calCrew === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
            </select>
          </div>
          ${rows.length ? gantt(rows, from, to) : empty('Nothing scheduled in these 12 weeks.')}
          <div class="legend">
            ${STAGES.map(s => `<span><span class="dot" style="background:${s.color}"></span>${s.label}</span>`).join('')}
            <span><span class="ms-key"></span>Milestone</span>
            <span><span style="width:3px;height:12px;background:var(--c-red);display:inline-block;border-radius:2px"></span>Deadline</span>
          </div>
        </section>
        <section class="card">
          <h2>Needs a timeline <span class="muted">${toPlan.length}</span></h2>
          <div class="rows">${toPlan.length ? toPlan.map(p => `<div class="brow" style="align-items:center">
            <div class="brow-main"><a class="brow-title" href="#/project/${p.id}">${esc(p.name)}</a>
              <div class="muted">${esc(p.jobNo)} · ${STAGES.filter(s => !p.stages[s.key].start && p.stages[s.key].status !== 'Complete').map(s => s.label).join(', ')} not scheduled</div></div>
            <button class="btn btn-ghost btn-sm" onclick="planTimeline('${p.id}')">Plan timeline</button>
          </div>`).join('') : empty('Every active project has dates.')}</div>
        </section>`;
    }

    /* ══════════ Defects & variations ══════════ */

    function issueStatusTag(i) {
      const cls = { Open: 'tag-bad', 'In progress': 'tag-warn', Fixed: 'tag-good', Pending: 'tag-warn', Approved: 'tag-good', Completed: 'tag-good', Rejected: '' }[i.status] || '';
      return `<span class="tag ${cls}">${esc(i.status)}</span>`;
    }

    function editIssue(pid, iid, kind) {
      const p = getP(pid);
      const it = iid ? p.issues.find(x => x.id === iid)
        : { kind, title: '', stage: currentStage(p)?.key || '', status: kind === 'Defect' ? 'Open' : 'Pending', raisedBy: '', raised: today(), amount: '', description: '' };
      const isVar = it.kind === 'Variation';
      openForm({
        title: iid ? `${it.kind} ${it.ref}` : `Add ${it.kind.toLowerCase()}`,
        fields: [
          { name: 'title', label: it.kind, value: it.title, required: true, wide: true, placeholder: isVar ? 'e.g. Add extra outlet to study' : 'e.g. Condensate leak at bedroom 2 FCU' },
          { name: 'stage', label: 'Stage', value: it.stage, options: [['', 'General'], ...STAGES.map(s => [s.key, s.label])] },
          { name: 'status', label: 'Status', value: it.status, options: isVar ? VARIATION_STATUS : DEFECT_STATUS },
          { name: 'raisedBy', label: isVar ? 'Requested by' : 'Raised by', value: it.raisedBy, placeholder: 'e.g. Builder site supervisor' },
          { name: 'raised', label: 'Date raised', value: it.raised, type: 'date' },
          { name: 'amount', label: isVar ? 'Price to client ($ ex GST)' : 'Cost to fix ($, optional)', value: it.amount, type: 'number', step: '0.01' },
          { name: 'description', label: 'Details', value: it.description, type: 'textarea', wide: true }
        ],
        onSave: v => {
          const target = iid ? it : { id: uid(), kind, ref: nextRef(p, kind) };
          const wasClosed = ['Fixed', 'Completed'].includes(target.status);
          Object.assign(target, v);
          const isClosed = ['Fixed', 'Completed'].includes(target.status);
          if (isClosed && !wasClosed) target.closed = today();
          if (!isClosed) target.closed = '';
          if (!iid) p.issues.push(target);
        },
        onDelete: iid && (() => {
          if (!confirm(`Delete ${it.kind.toLowerCase()} ${it.ref}?`)) return false;
          p.issues = p.issues.filter(x => x.id !== iid);
        })
      });

    /* ══════════ Documents ══════════ */

    function guessDocCategory(name) {
      const n = name.toLowerCase();
      if (/plan|drawing|layout/.test(n)) return 'Plans';
      if (/permit|approval/.test(n)) return 'Permit / approval';
      if (/cert|coc|compliance/.test(n)) return 'Compliance certificate';
      if (/quote/.test(n)) return 'Quote';
      if (/invoice/.test(n)) return 'Invoice';
      if (/purchase|\bpo\b/.test(n)) return 'Purchase order';
      if (/warrant|manual/.test(n)) return 'Warranty / manual';
      return 'Other';
    }

    async function addDocs(pid, files) {
      const p = getP(pid);
      let added = 0;
      for (const f of files) {
        if (f.size > 25 * 1048576) { toast(`${f.name} is over 25 MB`); continue; }
        const id = uid();
        try {
          await idb('files', 'readwrite', s => s.put(f, id));
        } catch (err) {
          console.error(err);
          toast(`Could not save ${f.name}`);
          continue;
        }
        queueUpload('files', id);
        p.docs.push({ id, name: f.name, category: guessDocCategory(f.name), size: f.size, type: f.type, at: Date.now() });
        added++;
      }
      save(); render();
      if (added) toast(added === 1 ? 'Document added' : added + ' documents added');
    }

    async function openDoc(pid, id) {
      const d = getP(pid).docs.find(x => x.id === id);
      let blob = await idb('files', 'readonly', s => s.get(id));
      if (!blob && CLOUD) {
        toast('Downloading…');
        blob = await downloadFile('files', id);
      }
      if (!blob) { toast(CLOUD ? 'Could not download the file — check your connection' : 'File not found on this device'); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener';
      if (!/^(image\/|application\/pdf|text\/)/.test(blob.type)) a.download = d.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }

    function editDoc(pid, id) {
      const p = getP(pid);
      const d = p.docs.find(x => x.id === id);
      openForm({
        title: 'Document',
        fields: [
          { name: 'name', label: 'Name', value: d.name, required: true, wide: true },
          { name: 'category', label: 'Category', value: d.category, options: DOC_CATS }
        ],
        onSave: v => Object.assign(d, v),
        onDelete: () => {
          if (!confirm(`Delete ${d.name}?`)) return false;
          p.docs = p.docs.filter(x => x.id !== id);
          idb('files', 'readwrite', s => s.delete(id));
          removeRemoteFile('files', id);
        }
      });
    }

        .filter(p => (!ui.rTrade || p.trade === ui.rTrade)
          && (ui.rStatus === 'all' || (ui.rStatus === 'open' ? p.status !== 'Complete' : p.status === ui.rStatus)))
        .sort((a, b) => String(a.jobNo).localeCompare(String(b.jobNo)));
    }

    function reportsView() {
      const ps = reportProjects();
      const rows = ps.map(p => ({ p, jc: costing(p) }));
      const F = ['contract', 'variations', 'revenue', 'hours', 'quotedHours', 'labour', 'materials', 'materialsBudget', 'defects', 'cost', 'profit'];
      const tot = Object.fromEntries(F.map(f => [f, rows.reduce((n, r) => n + r.jc[f], 0)]));
      const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
      const noValue = rows.filter(r => !r.jc.contract).length;

      const byCrew = {};
      ps.forEach(p => STAGES.forEach(s => p.stages[s.key].time.forEach(t => {
        if ((ui.rFrom && t.date < ui.rFrom) || (ui.rTo && t.date > ui.rTo)) return;
        const h = parseFloat(t.hours) || 0;
        const r = byCrew[t.crewId] = byCrew[t.crewId] || { hours: 0, cost: 0, projects: new Set() };
        r.hours += h;
        r.cost += h * crewRate(t.crewId);
        r[s.key] = (r[s.key] || 0) + h;
        r.projects.add(p.id);
      })));
      const crewRows = Object.entries(byCrew).sort((a, b) => b[1].hours - a[1].hours);
      const crewTot = crewRows.reduce((t, [, r]) => ({ hours: t.hours + r.hours, cost: t.cost + r.cost }), { hours: 0, cost: 0 });

      const bySupplier = {};
      ps.forEach(p => p.materials.forEach(m => {
        const key = (m.supplier || '').trim() || 'No supplier';
        const r = bySupplier[key] = bySupplier[key] || { lines: 0, cost: 0, projects: new Set() };
        r.lines++;
        r.cost += lineCost(m);
        r.projects.add(p.id);
      }));
      const supRows = Object.entries(bySupplier).sort((a, b) => b[1].cost - a[1].cost);

      return `
        <div class="page-head">
          <h1 class="page-title">Reports</h1>
          <button class="btn btn-ghost" onclick="exportProfitCSV()">Export CSV</button>
        </div>
        <div class="filters">
          <select onchange="ui.rTrade = this.value; render()">
            <option value="">All trades</option>
            ${TRADES.map(t => `<option ${ui.rTrade === t ? 'selected' : ''}>${t}</option>`).join('')}
          </select>
          <select onchange="ui.rStatus = this.value; render()">
            ${[['all', 'All projects'], ['open', 'Open (active + on hold)'], ['Active', 'Active'], ['On hold', 'On hold'], ['Complete', 'Complete']]
              .map(([v, l]) => `<option value="${v}" ${ui.rStatus === v ? 'selected' : ''}>${l}</option>`).join('')}
          </select>
        </div>

        <div class="stats">
          ${costTile('Revenue', money0(tot.revenue), `${ps.length} project${ps.length === 1 ? '' : 's'}`)}
          ${costTile('Costs', money0(tot.cost), `Labour ${money0(tot.labour)} · materials ${money0(tot.materials)}`)}
          ${costTile('Profit', money0(tot.profit), '', tot.profit < 0 ? 'neg' : '')}
          ${costTile('Margin', pct(tot.profit, tot.revenue), tot.quotedHours ? `${fmtH(tot.hours)} of ${fmtH(tot.quotedHours)} quoted` : fmtH(tot.hours) + ' logged')}
        </div>
        ${noValue ? `<div class="warn-box" style="margin-bottom:12px">${noValue} project${noValue === 1 ? ' has' : 's have'} no contract value, so ${noValue === 1 ? 'it shows' : 'they show'} as a loss. Add it with Edit on the project page.</div>` : ''}

        <h2 class="h-section">Profit by project</h2>
        <section class="card">
          ${rows.length ? `<div class="tbl-wrap"><table class="tbl">
            <thead><tr><th>Project</th><th class="num">Contract</th><th class="num">Variations</th><th class="num">Hours</th><th class="num">Labour</th><th class="num">Materials</th><th class="num">Defects</th><th class="num">Profit</th><th class="num">Margin</th></tr></thead>
            <tbody>
              ${rows.map(({ p, jc }) => `<tr class="click" onclick="location.hash='#/project/${p.id}'">
                <td><b>${esc(p.name)}</b><div class="faint">${esc(p.jobNo)} · ${esc(p.status)}</div></td>
                <td class="num">${money0(jc.contract)}</td>
                <td class="num">${jc.variations ? money0(jc.variations) : ''}</td>
                <td class="num ${jc.quotedHours && jc.hours > jc.quotedHours ? 'over' : ''}">${fmtH(jc.hours)}${jc.quotedHours ? `<div class="faint">of ${fmtH(jc.quotedHours)}</div>` : ''}</td>
                <td class="num">${money0(jc.labour)}</td>
                <td class="num ${jc.materialsBudget && jc.materials > jc.materialsBudget ? 'over' : ''}">${money0(jc.materials)}${jc.materialsBudget ? `<div class="faint">of ${money0(jc.materialsBudget)}</div>` : ''}</td>
                <td class="num">${jc.defects ? money0(jc.defects) : ''}</td>
                <td class="num ${jc.profit < 0 ? 'neg' : ''}"><b>${money0(jc.profit)}</b></td>
                <td class="num ${jc.profit < 0 ? 'neg' : ''}">${jc.margin === null ? '—' : Math.round(jc.margin) + '%'}</td>
              </tr>`).join('')}
              <tr class="tot">
                <td>Total</td>
                <td class="num">${money0(tot.contract)}</td>
                <td class="num">${money0(tot.variations)}</td>
                <td class="num">${fmtH(tot.hours)}</td>
                <td class="num">${money0(tot.labour)}</td>
                <td class="num">${money0(tot.materials)}</td>
                <td class="num">${money0(tot.defects)}</td>

        <h2 class="h-section">Hours by crew
          <span class="range">

        <section class="card">
          ${crewRows.length ? `<div class="tbl-wrap"><table class="tbl">

                <td class="num"><b>${fmtH(r.hours)}</b></td>
                <td class="num">${money0(r.cost)}</td>
                <td class="num">${r.projects.size}</td>
              </tr>`).join('')}
              <tr class="tot"><td>Total</td>${STAGES.map(() => '<td></td>').join('')}<td class="num">${fmtH(crewTot.hours)}</td><td class="num">${money0(crewTot.cost)}</td><td></td></tr>
            </tbody>
          </table></div>` : empty('No time logged in this date range.')}
        </section>

        <h2 class="h-section">Materials by supplier</h2>
        <section class="card">
          ${supRows.length ? `<div class="tbl-wrap"><table class="tbl">
            <thead><tr><th>Supplier</th><th class="num">Line items</th><th class="num">Projects</th><th class="num">Cost</th></tr></thead>
            <tbody>
              ${supRows.map(([name, r]) => `<tr><td>${esc(name)}</td><td class="num">${r.lines}</td><td class="num">${r.projects.size}</td><td class="num">${money0(r.cost)}</td></tr>`).join('')}
              <tr class="tot"><td>Total</td><td></td><td></td><td class="num">${money0(tot.materials)}</td></tr>
            </tbody>
          </table></div>` : empty('No materials recorded on these projects.')}
        </section>`;

    function exportProfitCSV() {
      const rows = [['Job no', 'Project', 'Trade', 'Status', 'Contract', 'Variations', 'Revenue', 'Hours', 'Quoted hours', 'Labour cost', 'Materials', 'Materials budget', 'Defect costs', 'Total cost', 'Profit', 'Margin %']];
      reportProjects().forEach(p => {
        const jc = costing(p);
        rows.push([p.jobNo, p.name, p.trade, p.status, r2(jc.contract), r2(jc.variations), r2(jc.revenue), r2(jc.hours), jc.quotedHours || '',
          r2(jc.labour), r2(jc.materials), jc.materialsBudget || '', r2(jc.defects), r2(jc.cost), r2(jc.profit), jc.margin === null ? '' : Math.round(jc.margin)]);
      });
      const csv = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
      saveFile(new File([csv], `hcm-profit-report-${today()}.csv`, { type: 'text/csv' }));
    }

    /* ══════════ Printable stage / project report ══════════ */

    function reportView(p, key) {
      const scope = key === 'all' ? STAGES : STAGES.filter(s => s.key === key);
      if (!scope.length) return notFound();
      const title = key === 'all' ? 'Project report' : `${scope[0].label} stage report`;
      const issues = p.issues.filter(i => key === 'all' || i.stage === key);
      const c = p.customer || {};
      const back = key === 'all' ? `#/project/${p.id}` : `#/project/${p.id}/stage/${key}`;
      const stageLabel = k => STAGES.find(s => s.key === k)?.label || 'General';
      const showEquip = (key === 'all' || key === 'fitoff') && p.equipment.length;

      return `
        <div class="report-bar no-print">
          <a class="back" href="${back}">${ICON.back} Back</a>
          <label class="toggle"><input type="checkbox" ${ui.repPhotos ? 'checked' : ''} onchange="ui.repPhotos = this.checked; render()" /> Photos</label>
          <label class="toggle"><input type="checkbox" ${ui.repTime ? 'checked' : ''} onchange="ui.repTime = this.checked; render()" /> Time log</label>
          <button class="btn" onclick="window.print()">${ICON.print} Print / save PDF</button>
        </div>
        <article class="report">
          <div class="r-head">
            <div>
              <h1>${title}</h1>
              <div class="r-sub">${esc(p.jobNo)} · ${esc(p.name)}</div>
            </div>
            <img src="./logo.jpg" alt="Heatcool Masters" />
          </div>
          <table class="r-kv">
            <tr><th>Site address</th><td>${esc(p.address) || '—'}</td></tr>
            <tr><th>Customer</th><td>${[c.name, c.phone, c.email].filter(Boolean).map(esc).join(' · ') || '—'}</td></tr>
            <tr><th>Builder / client</th><td>${esc(p.builder) || '—'}</td></tr>
            <tr><th>Trade</th><td>${esc(p.trade)}</td></tr>
            ${p.deadline ? `<tr><th>Deadline / handover</th><td>${fmtDate(p.deadline, true)}</td></tr>` : ''}
            <tr><th>Report date</th><td>${fmtDate(today(), true)}</td></tr>
          </table>

          ${key === 'all' && p.milestones.length ? `<h2>Milestones</h2>
            <table class="r-tbl">
              <tr><th>Milestone</th><th>Date</th><th>Status</th></tr>
              ${[...p.milestones].sort((a, b) => (a.date || '').localeCompare(b.date || '')).map(m => `<tr>
                <td>${esc(m.title)}</td><td>${fmtDate(m.date, true) || '—'}</td><td>${m.done ? 'Done' : m.date && m.date < today() ? 'Overdue' : 'Upcoming'}</td>
              </tr>`).join('')}
            </table>` : ''}

          ${scope.map(s => reportStage(p, s)).join('')}

          ${issues.length ? `<h2>Defects & variations</h2>
            <table class="r-tbl">
              <tr><th>Ref</th><th>Item</th><th>Stage</th><th>Status</th><th class="num">Amount</th></tr>
              ${issues.map(i => `<tr>
                <td>${esc(i.ref)}</td>
                <td><b>${esc(i.title)}</b>${i.description ? `<div class="r-muted">${esc(i.description)}</div>` : ''}<div class="r-muted">${i.kind}, raised ${fmtDate(i.raised, true)}${i.raisedBy ? ' by ' + esc(i.raisedBy) : ''}${i.closed ? ', closed ' + fmtDate(i.closed, true) : ''}</div></td>
                <td>${stageLabel(i.stage)}</td>
                <td>${esc(i.status)}</td>
                <td class="num">${i.kind === 'Variation' && i.amount ? money(i.amount) : ''}</td>
              </tr>`).join('')}
            </table>` : ''}

          ${showEquip ? `<h2>Installed equipment</h2>
            <table class="r-tbl">
              <tr><th>Equipment</th><th>Serial no.</th><th>Location</th><th>Installed</th><th>Warranty to</th></tr>
              ${p.equipment.map(e => `<tr>
                <td><b>${esc(e.brandModel)}</b><div class="r-muted">${esc(e.type)}</div></td>
                <td>${esc(e.serial) || '—'}</td>
                <td>${esc(e.location) || '—'}</td>
                <td>${fmtDate(e.installed, true) || '—'}</td>
                <td>${fmtDate(e.warrantyEnd, true) || '—'}</td>
              </tr>`).join('')}
            </table>` : ''}

          <div class="r-foot">Heatcool Masters · ${esc(p.jobNo)} · Generated ${new Date().toLocaleString('en-AU')}</div>
        </article>`;
    }

    function reportStage(p, s) {
      const st = p.stages[s.key];
      const pr = checkProgress(st);
      const hours = st.time.reduce((n, t) => n + (parseFloat(t.hours) || 0), 0);
      return `
        <h2 style="border-left-color:${s.color}">${s.label} <span>${st.status}</span></h2>
        <table class="r-kv">
          <tr><th>Dates</th><td>${dateRange(st.start, st.end)}</td></tr>
          <tr><th>Crew</th><td>${esc(crewNames(st.crew)) || '—'}</td></tr>
          <tr><th>Checklist</th><td>${pr.done} of ${pr.total} complete</td></tr>
        </table>

        ${st.checklist.length ? `<h3>Checklist</h3>
          <table class="r-tbl">${st.checklist.map(i => `<tr>
            <td class="r-tick">${i.done ? '✓' : '—'}</td>
            <td>${esc(i.text)}</td>
            <td class="num r-muted">${i.done && i.doneAt ? fmtTime(i.doneAt) : 'Not done'}</td>
          </tr>`).join('')}</table>` : ''}

        ${st.readings.length ? `<h3>Readings & tests</h3>
          <table class="r-tbl">
            <tr><th>Reading</th><th class="num">Value</th><th>Recorded</th></tr>
            ${st.readings.map(r => `<tr>
              <td>${esc(r.type)}${r.note ? `<div class="r-muted">${esc(r.note)}</div>` : ''}</td>
              <td class="num"><b>${esc(r.value)}</b> ${esc(r.unit)}</td>
              <td class="r-muted">${fmtTime(r.at)}${r.by ? ' · ' + esc(getCrew(r.by)?.name || '') : ''}</td>
            </tr>`).join('')}
          </table>` : ''}

        ${ui.repTime && st.time.length ? `<h3>Time log (${fmtH(hours)})</h3>
          <table class="r-tbl">
            <tr><th>Date</th><th>Crew</th><th class="num">Hours</th><th>Work done</th></tr>
            ${[...st.time].sort((a, b) => a.date.localeCompare(b.date)).map(t => `<tr>
              <td>${fmtDate(t.date, true)}</td><td>${esc(getCrew(t.crewId)?.name || '')}</td><td class="num">${esc(t.hours)}</td><td>${esc(t.note)}</td>
            </tr>`).join('')}
          </table>` : ''}

        ${st.notes ? `<h3>Notes</h3><div class="r-notes">${esc(st.notes)}</div>` : ''}

        ${ui.repPhotos && st.photos.length ? `<h3>Photos</h3>
          <div class="r-photos">${st.photos.map(ph => `<figure><img data-photo="${ph.id}" alt="" />${ph.caption ? `<figcaption>${esc(ph.caption)}</figcaption>` : ''}</figure>`).join('')}</div>` : ''}

        <h3>Sign-off</h3>
        <div class="r-sig">${st.signoff
          ? `Signed by <b>${esc(st.signoff.name)}</b> on ${fmtDate(st.signoff.date, true)}<img src="${st.signoff.sig}" alt="Signature" />`
          : `<div class="r-muted">Name: ______________________________ &nbsp; Date: ____________</div><div class="r-sig-line"></div>`}</div>`;
    }

    /* ══════════ Modal ══════════ */

    let formHandlers = null;

    function showModal(html) {
      $('modal-card').innerHTML = html;
      $('modal').hidden = false;
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      $('modal').hidden = true;
      $('modal-card').innerHTML = '';
      document.body.style.overflow = '';
      formHandlers = null;
      if (sync.pendingRender) setTimeout(requestRender, 0);
    }

    function fieldHTML(f) {
      const attrs = `name="${f.name}" id="f-${f.name}" ${f.required ? 'required' : ''} placeholder="${esc(f.placeholder || '')}"`;
      let input;
      if (f.options) {
        input = `<select ${attrs}>${f.options.map(o => {
          const [val, label] = Array.isArray(o) ? o : [o, o];
          return `<option value="${esc(val)}" ${String(f.value ?? '') === String(val) ? 'selected' : ''}>${esc(label)}</option>`;
        }).join('')}</select>`;
      } else if (f.type === 'textarea') {
        input = `<textarea ${attrs}>${esc(f.value)}</textarea>`;
      } else {
        input = `<input type="${f.type || 'text'}" ${f.step ? `step="${f.step}"` : ''} value="${esc(f.value)}" ${attrs} />`;
      }
      return `<div class="${f.wide ? 'fwide' : ''}"><label class="lbl" for="f-${f.name}">${f.label}</label>${input}</div>`;
    }

    function openForm({ title, fields, saveLabel = 'Save', onSave, onDelete }) {
      formHandlers = { onSave, onDelete };
      showModal(`
        <h3>${title}</h3>
        <form id="modal-form" onsubmit="event.preventDefault(); submitForm()">
          <div class="fgrid">${fields.map(fieldHTML).join('')}</div>
          <div class="modal-actions">
            <button class="btn" type="submit">${saveLabel}</button>
            <button class="btn btn-ghost" type="button" onclick="closeModal()">Cancel</button>
            ${onDelete ? '<span class="spacer"></span><button class="btn btn-danger" type="button" onclick="deleteFromForm()">Delete</button>' : ''}
          </div>
        </form>`);
      const firstInput = $('modal-card').querySelector('input:not([type=date]), textarea');
      if (firstInput && matchMedia('(pointer: fine)').matches) firstInput.focus();
    }

    function submitForm() {
      const values = Object.fromEntries(new FormData($('modal-form')));
      if (formHandlers.onSave(values) === false) return;
      save(); closeModal(); render();
    }

    function deleteFromForm() {
      if (formHandlers.onDelete() === false) return;
      save(); closeModal(); render();
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('modal').hidden) closeModal(); });

    /* iOS ignores user-scalable=no, so block pinch-zoom directly */
    ['gesturestart', 'gesturechange'].forEach(type => document.addEventListener(type, e => e.preventDefault(), { passive: false }));
    document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

    /* ══════════ Router ══════════ */

    function notFound() {
      return `<section class="card">${empty('That page or project could not be found.')}<a class="btn btn-ghost" style="margin-top:12px" href="#/">Back to dashboard</a></section>`;
    }

    function render() {
      const signedOut = CLOUD && !session;
      document.body.classList.toggle('signed-out', signedOut);
      if (signedOut) {
        $('app').innerHTML = loginView();
        return;
      }
      setSyncStatus(sync.status);
      const [view = '', id, sub, key] = location.hash.replace(/^#\/?/, '').split('/');
      const tab = view === 'project' ? 'projects' : view;
      document.querySelectorAll('#tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));

      let html;
      if (view === '') html = dashboardView();
      else if (view === 'projects') html = projectsView();
      else if (view === 'schedule') html = scheduleView();
      else if (view === 'crew') html = crewView();
      else if (view === 'reports') html = reportsView();
      else if (view === 'settings') html = settingsView();
      else if (view === 'project') {
        const p = getP(id);
        html = !p ? notFound() : sub === 'stage' ? stageView(p, key) : sub === 'report' ? reportView(p, key) : projectView(p);
      } else html = notFound();
      document.body.classList.toggle('report-mode', view === 'project' && sub === 'report');

      $('app').innerHTML = html;
      loadPhotos();
      if ($('sigpad')) initSig($('sigpad'));
      showStorageUsed();
    }

    window.addEventListener('hashchange', () => { closeModal(); render(); window.scrollTo(0, 0); });

    /* ══════════ Start ══════════ */

    (async function init() {
      try {
        db = await openDB();
        const saved = await idb('kv', 'readonly', s => s.get('state'));
        if (saved) state = saved;
        state = normalize(state);
        if (CLOUD) Object.assign(sync, await idb('kv', 'readonly', s => s.get('sync')) || {});
        navigator.storage?.persist?.();
      } catch (err) {
        console.error(err);
        $('app').insertAdjacentHTML('beforebegin', '<div class="warn-box" style="margin-bottom:12px">Storage is unavailable in this browser (private mode?). Changes will not be saved.</div>');
      }
      if (CLOUD) await initCloud();
      render();
      if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js');
    })();
  </script>
</body>
</html>
